        - paragraph [ref=e40]: About me
        - heading "Hi, I’m Sidney." [level=2] [ref=e41]
        - paragraph [ref=e42]: I’m a vocalist, songwriter and actor based in Folkestone. I’ve spent years performing across the UK – on stage, on TV and radio, and in bands and studio sessions. Music isn’t just something I do; it’s the world I live in every day.
        - paragraph [ref=e43]: I’ve trained with leading vocal coaches including Kate Cameron, Gareth Malone, Nicola Palmer and ILĀ. Their guidance helped me build a technique that’s expressive, flexible and rooted in real artistry, not rigid rules.
        - paragraph [ref=e44]: In lessons, I bring all of that experience into the room – whether we’re strengthening your voice, shaping a song, or preparing for a performance or studio session.
        - list [ref=e45]:
          - listitem [ref=e46]: Grade 8 vocalist, multi-genre and texture-focused
          - listitem [ref=e47]: Experience teaching all ages and levels
          - listitem [ref=e48]: Private studio with pro recording equipment
