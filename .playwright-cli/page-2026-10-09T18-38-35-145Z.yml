        - heading "“Supportive, inspiring, and really knows how to get the best out of you.”" [level=2] [ref=e122]
        - paragraph [ref=e123]: Working with Sidney as my vocal coach has been an absolute joy. Not only is he a phenomenal singer with a brilliant ear for music, but he also brings a deep sense of understanding, empathy and fun to every session. His musicianship is outstanding, but what really sets him apart is the way he tailors his teaching to each individual.
        - paragraph [ref=e124]: Sidney creates a safe, encouraging space where you're never pressured but always supported. He listens carefully to your voice, helps you discover what works for you, and celebrates your progress every step of the way.
        - paragraph [ref=e125]: – Ery, 41
